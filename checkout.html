<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar Compra — Agência Rocha7</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/checkout.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <header id="site-header"></header>

  <main class="page-content">
    <div class="container">

      <!-- Checkout Steps Bar -->
      <div class="steps">
        <div class="step completed">
          <div class="step-numero">✓</div>
          <div class="step-label">Carrinho</div>
        </div>
        <div class="step-line completed"></div>
        <div class="step active">
          <div class="step-numero">2</div>
          <div class="step-label">Identificação & Dados</div>
        </div>
        <div class="step-line"></div>
        <div class="step">
          <div class="step-numero">3</div>
          <div class="step-label">Confirmação</div>
        </div>
      </div>

      <div id="checkout-container">
        <!-- Injetado via JS -->
      </div>

    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="js/pages/checkout.js"></script>
</body>

</html>
